<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="1080" viewBox="0 0 1800 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HetLoRA-M architecture for heterogeneous federated LLM fine-tuning</title>
  <desc id="desc">Icon-based architecture diagram showing heterogeneous LoRA clients, Frobenius-weighted adapter aggregation, adapter-space EMA momentum, rank-aware truncation, and evaluation across Yelp, GSM8K, and Alpaca.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowPurple" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowTeal" markerWidth="13" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <linearGradient id="serverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="methodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .ink { fill: #0f172a; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #475569; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font-size: 22px; }
      .small { font-size: 26px; }
      .mid { font-size: 32px; }
      .title { font-size: 50px; font-weight: 850; letter-spacing: 0; }
      .label { font-size: 28px; font-weight: 780; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .soft { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; }
      .rank4 { fill: #dbeafe; stroke: #2563eb; }
      .rank8 { fill: #dcfce7; stroke: #16a34a; }
      .rank16 { fill: #ffedd5; stroke: #ea580c; }
      .rank32 { fill: #fce7f3; stroke: #db2777; }
      .purple { fill: #7c3aed; }
      .teal { fill: #0f766e; }
      .orange { fill: #ea580c; }
      .blue { fill: #2563eb; }
      .green { fill: #16a34a; }
      .red { fill: #dc2626; }
      .line { stroke: #334155; stroke-width: 5; fill: none; marker-end: url(#arrow); }
      .lineTeal { stroke: #0f766e; stroke-width: 5; fill: none; marker-end: url(#arrowTeal); }
      .linePurple { stroke: #7c3aed; stroke-width: 5; fill: none; marker-end: url(#arrowPurple); }
      .dash { stroke-dasharray: 10 10; }
      .matrixCell { rx: 5; ry: 5; }
    </style>
    <symbol id="phone" viewBox="0 0 60 84">
      <rect x="10" y="3" width="40" height="78" rx="9" fill="currentColor"/>
      <rect x="16" y="12" width="28" height="55" rx="3" fill="#fff" opacity="0.92"/>
      <circle cx="30" cy="73" r="3" fill="#fff"/>
    </symbol>
    <symbol id="laptop" viewBox="0 0 96 70">
      <rect x="14" y="4" width="68" height="46" rx="5" fill="currentColor"/>
      <rect x="20" y="10" width="56" height="34" rx="2" fill="#fff" opacity="0.9"/>
      <path d="M6 56h84l-8 10H14z" fill="currentColor"/>
    </symbol>
    <symbol id="server" viewBox="0 0 92 92">
      <rect x="13" y="8" width="66" height="76" rx="10" fill="currentColor"/>
      <rect x="23" y="18" width="46" height="13" rx="4" fill="#fff" opacity="0.9"/>
      <rect x="23" y="39" width="46" height="13" rx="4" fill="#fff" opacity="0.9"/>
      <rect x="23" y="60" width="46" height="13" rx="4" fill="#fff" opacity="0.9"/>
      <circle cx="31" cy="24.5" r="2.8" fill="currentColor"/>
      <circle cx="31" cy="45.5" r="2.8" fill="currentColor"/>
      <circle cx="31" cy="66.5" r="2.8" fill="currentColor"/>
    </symbol>
    <symbol id="lock" viewBox="0 0 64 64">
      <rect x="14" y="27" width="36" height="28" rx="7" fill="currentColor"/>
      <path d="M22 27v-8c0-7 4.7-12 10-12s10 5 10 12v8" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <circle cx="32" cy="40" r="4" fill="#fff"/>
    </symbol>
    <symbol id="scale" viewBox="0 0 90 90">
      <path d="M45 13v60M25 28h40M45 20l-25 8M45 20l25 8" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M13 33l12 25 12-25M53 33l12 25 12-25" stroke="currentColor" stroke-width="6" stroke-linejoin="round" fill="none"/>
      <path d="M18 59h14M58 59h14M31 77h28" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="loop" viewBox="0 0 88 88">
      <path d="M65 25c-8-11-25-15-38-6-14 9-17 28-8 42 10 15 31 17 44 4" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
      <path d="M65 25l-4-17 17 5z" fill="currentColor"/>
    </symbol>
    <symbol id="scissors" viewBox="0 0 90 90">
      <circle cx="24" cy="25" r="11" fill="none" stroke="currentColor" stroke-width="7"/>
      <circle cx="24" cy="64" r="11" fill="none" stroke="currentColor" stroke-width="7"/>
      <path d="M34 31l39 35M34 58l39-34" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
    <symbol id="chart" viewBox="0 0 92 92">
      <rect x="13" y="13" width="66" height="66" rx="8" fill="currentColor"/>
      <rect x="25" y="52" width="9" height="16" fill="#fff"/>
      <rect x="42" y="39" width="9" height="29" fill="#fff"/>
      <rect x="59" y="27" width="9" height="41" fill="#fff"/>
    </symbol>
  </defs>

  <rect class="bg" width="1800" height="1080"/>
  <text class="ink title" x="900" y="74" text-anchor="middle">Heterogeneous-Rank Federated LLM Fine-Tuning</text>
  <text class="muted small" x="900" y="116" text-anchor="middle">Aggregation space matters: dense ΔW, LoRA factors, and momentum behave differently under non-IID clients</text>

  <rect x="62" y="165" width="420" height="770" rx="28" class="card"/>
  <text class="ink label" x="272" y="218" text-anchor="middle">Heterogeneous Clients</text>
  <text class="muted tiny" x="272" y="253" text-anchor="middle">50 clients · K=5 per round · frozen base LLM</text>

  <g transform="translate(104 302)">
    <rect x="0" y="0" width="148" height="154" rx="18" class="rank4" stroke-width="3"/>
    <use href="#phone" x="44" y="23" width="60" height="84" color="#2563eb"/>
    <text class="ink small" x="74" y="129" text-anchor="middle" font-weight="750">r=4</text>
    <text class="muted tiny" x="74" y="153" text-anchor="middle">20 clients</text>
  </g>
  <g transform="translate(292 302)">
    <rect x="0" y="0" width="148" height="154" rx="18" class="rank8" stroke-width="3"/>
    <use href="#phone" x="44" y="23" width="60" height="84" color="#16a34a"/>
    <text class="ink small" x="74" y="129" text-anchor="middle" font-weight="750">r=8</text>
    <text class="muted tiny" x="74" y="153" text-anchor="middle">20 clients</text>
  </g>
  <g transform="translate(104 505)">
    <rect x="0" y="0" width="148" height="154" rx="18" class="rank16" stroke-width="3"/>
    <use href="#laptop" x="26" y="31" width="96" height="70" color="#ea580c"/>
    <text class="ink small" x="74" y="129" text-anchor="middle" font-weight="750">r=16</text>
    <text class="muted tiny" x="74" y="153" text-anchor="middle">5 clients</text>
  </g>
  <g transform="translate(292 505)">
    <rect x="0" y="0" width="148" height="154" rx="18" class="rank32" stroke-width="3"/>
    <use href="#server" x="28" y="22" width="92" height="92" color="#db2777"/>
    <text class="ink small" x="74" y="129" text-anchor="middle" font-weight="750">r=32</text>
    <text class="muted tiny" x="74" y="153" text-anchor="middle">5 clients</text>
  </g>

  <rect x="118" y="707" width="296" height="142" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <use href="#lock" x="145" y="746" width="56" height="56" color="#475569"/>
  <text class="ink small" x="284" y="759" text-anchor="middle" font-weight="750">Frozen W₀</text>
  <text class="muted tiny" x="286" y="792" text-anchor="middle">train only LoRA</text>
  <text class="ink mid" x="285" y="834" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Bₖ Aₖ</text>

  <path class="line" d="M486 552 C560 552 568 552 630 552"/>
  <text class="muted tiny" x="556" y="522" text-anchor="middle">upload</text>
  <text class="ink small" x="556" y="585" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">(Bₖ,Aₖ)</text>

  <rect x="635" y="165" width="748" height="770" rx="30" fill="url(#serverGrad)" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <use href="#server" x="683" y="193" width="76" height="76" color="#0f766e"/>
  <text class="ink label" x="1010" y="230" text-anchor="middle">Server Aggregation</text>
  <text class="muted tiny" x="1010" y="262" text-anchor="middle">rank-aware, no full model upload</text>

  <g transform="translate(695 315)">
    <rect x="0" y="0" width="250" height="165" rx="22" class="soft"/>
    <use href="#scale" x="25" y="35" width="80" height="80" color="#0f766e"/>
    <text class="ink small" x="159" y="54" text-anchor="middle" font-weight="780">Frobenius</text>
    <text class="ink small" x="159" y="88" text-anchor="middle" font-weight="780">weights</text>
    <text class="muted tiny" x="159" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">‖BₖAₖ‖F</text>
  </g>

  <g transform="translate(1012 315)">
    <rect x="0" y="0" width="250" height="165" rx="22" class="soft"/>
    <g transform="translate(24 39)">
      <rect x="0" y="0" width="18" height="18" class="matrixCell" fill="#bfdbfe"/>
      <rect x="24" y="0" width="18" height="18" class="matrixCell" fill="#bbf7d0"/>
      <rect x="48" y="0" width="18" height="18" class="matrixCell" fill="#fed7aa"/>
      <rect x="72" y="0" width="18" height="18" class="matrixCell" fill="#fbcfe8"/>
      <rect x="0" y="24" width="18" height="18" class="matrixCell" fill="#bfdbfe"/>
      <rect x="24" y="24" width="18" height="18" class="matrixCell" fill="#bbf7d0"/>
      <rect x="48" y="24" width="18" height="18" class="matrixCell" fill="#fed7aa"/>
      <rect x="72" y="24" width="18" height="18" class="matrixCell" fill="#fbcfe8"/>
      <rect x="0" y="48" width="18" height="18" class="matrixCell" fill="#bfdbfe"/>
      <rect x="24" y="48" width="18" height="18" class="matrixCell" fill="#bbf7d0"/>
      <rect x="48" y="48" width="18" height="18" class="matrixCell" fill="#fed7aa"/>
      <rect x="72" y="48" width="18" height="18" class="matrixCell" fill="#fbcfe8"/>
    </g>
    <text class="ink small" x="168" y="59" text-anchor="middle" font-weight="780">Pad + average</text>
    <text class="muted tiny" x="168" y="96" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Braw, Araw</text>
    <text class="muted tiny" x="168" y="128" text-anchor="middle">adapter space</text>
  </g>

  <path class="lineTeal" d="M946 398 H1000"/>

  <g transform="translate(780 570)">
    <rect x="0" y="0" width="458" height="180" rx="25" fill="url(#methodGrad)" stroke="#a78bfa" stroke-width="3"/>
    <use href="#loop" x="35" y="49" width="84" height="84" color="#7c3aed"/>
    <text class="ink mid" x="268" y="55" text-anchor="middle" font-weight="850">HetLoRA-M</text>
    <text class="muted tiny" x="268" y="91" text-anchor="middle">EMA momentum on LoRA factors</text>
    <text class="ink small" x="268" y="132" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">B̄ ← βB̄ + (1−β)Braw</text>
    <text class="ink small" x="268" y="164" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Ā ← βĀ + (1−β)Araw</text>
  </g>

  <path class="linePurple" d="M1138 480 C1138 520 1138 525 1138 560"/>

  <g transform="translate(825 800)">
    <rect x="0" y="0" width="365" height="82" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2.5"/>
    <use href="#scissors" x="18" y="9" width="64" height="64" color="#7c3aed"/>
    <text class="ink small" x="206" y="34" text-anchor="middle" font-weight="780">rank-aware truncate</text>
    <text class="muted tiny" x="206" y="64" text-anchor="middle">r=4,8,16,32 · no SVD reorder</text>
  </g>

  <path class="linePurple" d="M1008 750 V790"/>
  <path class="line dash" d="M825 843 C600 902 481 861 403 820"/>
  <text class="muted tiny" x="599" y="917" text-anchor="middle">download adapter slices</text>

  <rect x="1450" y="165" width="288" height="770" rx="28" class="card"/>
  <text class="ink label" x="1594" y="218" text-anchor="middle">Evaluation</text>
  <text class="muted tiny" x="1594" y="253" text-anchor="middle">AUC · Mean-L5 · Best</text>

  <g transform="translate(1494 317)">
    <rect x="0" y="0" width="200" height="125" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
    <use href="#chart" x="22" y="27" width="72" height="72" color="#dc2626"/>
    <text class="ink small" x="136" y="49" text-anchor="middle" font-weight="820">Yelp</text>
    <text class="muted tiny" x="136" y="84" text-anchor="middle">α=.1/.5</text>
  </g>
  <g transform="translate(1494 495)">
    <rect x="0" y="0" width="200" height="125" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
    <text class="blue" x="57" y="76" text-anchor="middle" font-size="64" font-family="Georgia, serif" font-weight="900">∑</text>
    <text class="ink small" x="136" y="49" text-anchor="middle" font-weight="820">GSM8K</text>
    <text class="muted tiny" x="136" y="84" text-anchor="middle">math</text>
  </g>
  <g transform="translate(1494 673)">
    <rect x="0" y="0" width="200" height="125" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
    <text class="green" x="58" y="76" text-anchor="middle" font-size="58" font-family="Georgia, serif" font-weight="900">Aa</text>
    <text class="ink small" x="136" y="49" text-anchor="middle" font-weight="820">Alpaca</text>
    <text class="muted tiny" x="136" y="84" text-anchor="middle">ROUGE-L</text>
  </g>

  <path class="line" d="M1384 552 C1425 552 1427 552 1450 552"/>
  <text class="muted tiny" x="1418" y="522" text-anchor="middle">test</text>

  <rect x="92" y="970" width="1616" height="64" rx="18" fill="#0f172a"/>
  <text x="900" y="1011" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="780" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    Core claim: heterogeneous LoRA is a subspace-consensus problem; smoothing the right space preserves minority directions.
  </text>
</svg>
